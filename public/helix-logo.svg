<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Candlestick 1 -->
  <rect x="80" y="140" width="16" height="120" fill="#1e3a5f" rx="2"/>
  <rect x="80" y="100" width="16" height="20" fill="#1e3a5f" rx="2"/>
  <line x1="88" y1="80" x2="88" y2="100" stroke="#1e3a5f" stroke-width="4"/>
  <line x1="88" y1="260" x2="88" y2="280" stroke="#1e3a5f" stroke-width="4"/>
  
  <!-- Candlestick 2 (tallest) -->
  <rect x="140" y="80" width="16" height="180" fill="#2d5a87" rx="2"/>
  <rect x="140" y="60" width="16" height="20" fill="#2d5a87" rx="2"/>
  <line x1="148" y1="40" x2="148" y2="60" stroke="#2d5a87" stroke-width="4"/>
  <line x1="148" y1="260" x2="148" y2="300" stroke="#2d5a87" stroke-width="4"/>
  
  <!-- Candlestick 3 -->
  <rect x="200" y="160" width="16" height="100" fill="#2d5a87" rx="2"/>
  <rect x="200" y="140" width="16" height="20" fill="#2d5a87" rx="2"/>
  <line x1="208" y1="120" x2="208" y2="140" stroke="#2d5a87" stroke-width="4"/>
  <line x1="208" y1="260" x2="208" y2="280" stroke="#2d5a87" stroke-width="4"/>
  
  <!-- Candlestick 4 -->
  <rect x="260" y="120" width="16" height="140" fill="#1e4a6b" rx="2"/>
  <rect x="260" y="100" width="16" height="20" fill="#1e4a6b" rx="2"/>
  <line x1="268" y1="80" x2="268" y2="100" stroke="#1e4a6b" stroke-width="4"/>
  <line x1="268" y1="260" x2="268" y2="320" stroke="#1e4a6b" stroke-width="4"/>
  
  <!-- Curved flow lines -->
  <path d="M 60 180 Q 120 100 180 140 Q 240 180 300 100" stroke="#1a365d" stroke-width="12" fill="none" opacity="0.8"/>
  <path d="M 80 220 Q 140 300 200 260 Q 260 220 320 300" stroke="#1a365d" stroke-width="12" fill="none" opacity="0.6"/>
</svg>